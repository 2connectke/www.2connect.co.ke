<!doctype html>
<html lang="en-KE" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#0b1236" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="msapplication-TileColor" content="#0b1236" />
        <meta name="msapplication-TileImage" content="/icon-192.png" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />

        <!-- page-meta: scripts/prerender.mjs writes each page's search and sharing tags here -->

        <script>
            (function () {
                const appearance = 'system';

                if (appearance === 'system') {
                    const prefersDark = window.matchMedia(
                        '(prefers-color-scheme: dark)',
                    ).matches;

                    if (prefersDark) {
                        document.documentElement.classList.add('dark');
                    }
                }
            })();
        </script>

        <style>
            html {
                background-color: #fbf8f3;
            }

            html.dark {
                background-color: oklch(0.145 0 0);
            }
        </style>

        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link
            rel="icon"
            href="/favicon-32.png"
            type="image/png"
            sizes="32x32"
        />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />

        <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
        <link rel="dns-prefetch" href="https://fonts.bunny.net" />
        <link
            href="https://fonts.bunny.net/css?family=bricolage-grotesque:400,500,600,700,800|instrument-sans:400,500,600,700"
            rel="stylesheet"
        />

        <script type="module" src="/src/main.tsx"></script>
        <title>2Connect</title>
    </head>
    <body class="font-sans antialiased">
        <div id="app"></div>
    </body>
</html>
