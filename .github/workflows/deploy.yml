# Builds the site in app/ and deploys it to the "2connect" Cloudflare Pages
# project (https://2connect.co.ke) on every push to main.
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN: a Cloudflare API token
# with Account > Cloudflare Pages > Edit permission.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once; the newest push wins.
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 64e4033d9c8b3b285656f2d1392b1380
          wranglerVersion: '4.20.0'
          workingDirectory: app
          command: pages deploy dist --project-name 2connect --branch main
